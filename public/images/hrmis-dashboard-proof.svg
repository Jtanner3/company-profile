    <text x="532" y="671" fill="#94a3b8" font-size="10" font-weight="800">BRANCHES</text>
    <text x="532" y="695" fill="#111827" font-size="22" font-weight="850">Locations</text>
    <text x="848" y="671" fill="#94a3b8" font-size="10" font-weight="800">DEPARTMENTS</text>
